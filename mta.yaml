_schema-version: 3.3.0
ID: homemgtcapm
description: A simple CAP Project
version: 1.0.0
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: homemgtcapm-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: uaa_homemgtcapm
      - name: postgres-db
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
    build-parameters:
      builder: npm-ci
  - name: homemgtcapm-db-deployer
    type: nodejs
    path: gen/pg
    requires:
      - name: postgres-db
      - name: uaa_homemgtcapm
    parameters:
      buildpack: nodejs_buildpack
      no-route: true
      no-start: true
      tasks:
        - command: npm start
          name: deploy-to-postgresql
resources:
  - name: uaa_homemgtcapm
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        tenant-mode: dedicated
        xsappname: homemgtcapm-${org}-${space}
      path: ./xs-security.json
      service: xsuaa
      service-name: uaa_homemgtcapm-service
      service-plan: application
  - name: postgres-db
    type: org.cloudfoundry.managed-service
    parameters:
      service: postgresql-db
      service-plan: trial
parameters:
  enable-parallel-deployments: true