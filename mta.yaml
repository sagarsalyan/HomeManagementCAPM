_schema-version: 3.3.0
ID: homemgtcap
description: A simple CAP Project
version: 1.0.0
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: homemgtcap-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: uaa_homemgtcap
      - name: hana-hdi-container-emp
      - name: hana-hdi-container-sup
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
    build-parameters:
      builder: npm-ci
  - name: homemgtcap-db-deployer
    type: hdb
    path: gen/db
    requires:
      - name: hana-hdi-container-emp
      - name: uaa_homemgtcap
    parameters:
      buildpack: nodejs_buildpack
      no-route: true
      no-start: true
  - name: homemgtcap-db-deployer2
    type: hdb
    path: gen/db
    requires:
      - name: hana-hdi-container-sup
      - name: uaa_homemgtcap
    parameters:
      buildpack: nodejs_buildpack
      no-route: true
      no-start: true
resources:
  - name: uaa_homemgtcap
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        tenant-mode: dedicated
        xsappname: homemgtcap-${org}-${space}
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
      path: ./xs-security.json
      service: xsuaa
      service-name: uaa_homemgtcap-service
      service-plan: application
  - name: hana-hdi-container-sup
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: hana-hdi-container-emp
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
parameters:
  enable-parallel-deployments: true
