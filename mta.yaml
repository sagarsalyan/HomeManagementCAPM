_schema-version: 3.3.0
ID: homemgtcap
description: A simple CAP Project
version: 1.0.0
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: homemgtcap-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: uaa_homemgtcap
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
    build-parameters:
      builder: npm-ci
resources:
  - name: uaa_homemgtcap
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        tenant-mode: dedicated
        xsappname: homemgtcap-${org}-${space}
      path: ./xs-security.json
      service: xsuaa
      service-plan: application