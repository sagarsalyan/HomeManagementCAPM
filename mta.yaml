_schema-version: 3.3.0
ID: homemgtcap
description: A simple CAP Project
version: 1.0.0
modules:
- name: homemgtcap-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: uaa_homemgtcap
  - name: homemgtcap-db
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    instances: 1
  build-parameters:
    builder: npm-ci
- name: homemgtcap-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: homemgtcap-db
  parameters:
    buildpack: nodejs_buildpack
- name: homemgtcap-destination-content
  type: com.sap.application.content
  requires:
  - name: homemgtcap-destination-service
    parameters:
      content-target: true
  - name: homemgtcap_html_repo_host
    parameters:
      service-key:
        name: homemgtcap_html_repo_host-key
  - name: uaa_homemgtcap
    parameters:
      service-key:
        name: uaa_homemgtcap-key
  parameters:
    content:
      instance:
        destinations:
        - Name: homemgt_approuter_homemgtcap_html_repo_host
          ServiceInstanceName: homemgtcap-html5-app-host-service
          ServiceKeyName: homemgtcap_html_repo_host-key
          sap.cloud.service: homemgt-approuter
        - Authentication: OAuth2UserTokenExchange
          Name: homemgt_approuter_uaa_homemgtcap
          ServiceInstanceName: uaa_homemgtcap
          ServiceKeyName: uaa_homemgtcap-key
          sap.cloud.service: homemgt-approuter
        existing_destinations_policy: ignore
  build-parameters:
    no-source: true
- name: homemgtcap-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: homemgtcap_html_repo_host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - apphomemgtui5.zip
      name: apphomemgtui5
      target-path: resources/
- name: apphomemgtui5
  type: html5
  path: app/homemgtui5
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: uaa_homemgtcap
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      tenant-mode: dedicated
      xsappname: homemgtcap-${org}-${space}
    path: ./xs-security.json
    service: xsuaa
    service-plan: application
- name: homemgtcap-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
- name: homemgtcap-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          - Authentication: NoAuthentication
            HTML5.DynamicDestination: true
            HTML5.ForwardAuthToken: true
            Name: srv-api
            ProxyType: Internet
            Type: HTTP
            URL: ~{srv-api/srv-url}
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: homemgtcap-destination-service
    service-plan: lite
  requires:
  - name: srv-api
- name: homemgtcap_html_repo_host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: homemgtcap-html5-app-host-service
    service-plan: app-host
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
