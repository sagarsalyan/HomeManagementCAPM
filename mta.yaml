_schema-version: 3.3.0
ID: homemgtcap
description: A simple CAP Project
version: 1.0.0
modules:
- name: homemgtcap-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: uaa_homemgtcap
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    instances: 1
  build-parameters:
    builder: npm-ci
- name: homemgtcap-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: homemgtcap-repo-host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - apphomemgtui5.zip
      name: apphomemgtui5
      target-path: resources/
- name: apphomemgtui5
  type: html5
  path: app/homemgtui5
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: homemgtcap-destination-content
  type: com.sap.application.content
  requires:
  - name: homemgtcap-destination-service
    parameters:
      content-target: true
  - name: homemgtcap-repo-host
    parameters:
      service-key:
        name: homemgtcap-repo-host-key
  - name: uaa_homemgtcap
    parameters:
      service-key:
        name: uaa_homemgtcap-key
  parameters:
    content:
      instance:
        destinations:
        - Name: homemgt_approuter_homemgtcap_repo_host
          ServiceInstanceName: homemgtcap-html5-service
          ServiceKeyName: homemgtcap-repo-host-key
          sap.cloud.service: homemgt-approuter
        - Authentication: OAuth2UserTokenExchange
          Name: homemgt_approuter_uaa_homemgtcap
          ServiceInstanceName: uaa_homemgtcap
          ServiceKeyName: uaa_homemgtcap-key
          sap.cloud.service: homemgt-approuter
        existing_destinations_policy: ignore
  build-parameters:
    no-source: true
resources:
- name: uaa_homemgtcap
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      tenant-mode: dedicated
      xsappname: homemgtcap-${org}-${space}
    path: ./xs-security.json
    service: xsuaa
    service-plan: application
- name: homemgtcap-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: homemgtcap-html5-service
    service-plan: app-host
- name: homemgtcap-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      version: 1.0.0
    service: destination
    service-name: homemgtcap-destination-service
    service-plan: lite
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
