_schema-version: 3.3.0
ID: homemgtcapm
description: A simple CAP Project
version: 1.0.0
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: homemgtcapm-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: uaa_homemgtcapm
      - name: postgres-db
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
    build-parameters:
      builder: npm-ci
  - name: homemgtcapm-db-deployer
    type: nodejs
    path: gen/pg
    requires:
      - name: postgres-db
      - name: uaa_homemgtcapm
    parameters:
      buildpack: nodejs_buildpack
      no-route: true
      no-start: true
      tasks:
        - command: npm start
          name: deploy-to-postgresql
  - name: homemgtcapm-destination-content
    type: com.sap.application.content
    requires:
      - name: homemgtcapm-destination-service
        parameters:
          content-target: true
      - name: homemgtcapm_html_repo_host
        parameters:
          service-key:
            name: homemgtcapm_html_repo_host-key
      - name: uaa_homemgtcapm
        parameters:
          service-key:
            name: uaa_homemgtcapm-key
    parameters:
      content:
        instance:
          destinations:
            - Name: homemgtcapm_approuter_homemgtcapm_html_repo_host
              ServiceInstanceName: homemgtcapm_html_repo_host-service
              ServiceKeyName: homemgtcapm_html_repo_host-key
              sap.cloud.service: homemgtapprouter
            - Authentication: OAuth2UserTokenExchange
              Name: homemgtcapm_approuter_uaa_homemgtcapm
              ServiceInstanceName: uaa_homemgtcapm-service
              ServiceKeyName: uaa_homemgtcapm-key
              sap.cloud.service: homemgtapprouter
          existing_destinations_policy: update
    build-parameters:
      no-source: true
  - name: homemgtcapm-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: homemgtcapm_html_repo_host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - apphomemgtui5.zip
          name: homemgtcapmui5
          target-path: resources/
  - name: homemgtcapmui5
    type: html5
    path: app/homemgtui5
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms: []
resources:
  - name: uaa_homemgtcapm
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        tenant-mode: dedicated
        xsappname: homemgtcapm-${org}-${space}
      path: ./xs-security.json
      service: xsuaa
      service-name: uaa_homemgtcapm-service
      service-plan: application
  - name: postgres-db
    type: org.cloudfoundry.managed-service
    parameters:
      service: postgresql-db
      service-plan: trial
  - name: homemgtcapm-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            destinations:
              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com
              - Authentication: NoAuthentication
                HTML5.DynamicDestination: true
                HTML5.ForwardAuthToken: true
                Name: srv-api
                ProxyType: Internet
                Type: HTTP
                URL: ~{srv-api/srv-url}
            existing_destinations_policy: update
        version: 1.0.0
      service: destination
      service-name: homemgtcapm-destination-service
      service-plan: lite
    requires:
      - name: srv-api
  - name: homemgtcapm_html_repo_host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: homemgtcapm_html_repo_host-service
      service-plan: app-host
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true