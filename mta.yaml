_schema-version: 3.3.0
ID: homemgtcap
description: A simple CAP Project
version: 1.0.0
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: homemgtcap-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: uaa_homemgtcap
      - name: hana-hdi-container
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
    build-parameters:
      builder: npm-ci
  - name: homemgtcap-db-deployer
    type: hdb
    path: gen/db
    requires:
      - name: hana-hdi-container
      - name: uaa_homemgtcap
    parameters:
      buildpack: nodejs_buildpack
      no-route: true
      no-start: true
  - name: homemgtcap
    type: approuter.nodejs
    path: app/router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true
      - name: uaa_homemgtcap
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}
resources:
  - name: uaa_homemgtcap
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        tenant-mode: dedicated
        xsappname: homemgtcap-${org}-${space}
        oauth2-configuration:
          redirect-uris:
            - https://*~{app-api/app-uri}/**
          credential-types:
            - "binding-secret"
            - "x509"
        role-collections:
          - name: 'Student_Admin (homemgtcap ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.Student_Admin'
      path: ./xs-security.json
      service: xsuaa
      service-name: uaa_homemgtcap-service
      service-plan: application
    requires:
      - name: app-api
  - name: hana-hdi-container
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
parameters:
  enable-parallel-deployments: true
